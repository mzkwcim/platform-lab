on:
  pull_request:
    branches:
      - master

permissions:
  contents: read
  id-token: write

jobs:
  azure_oidc_test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/cloudflare
    steps:
      - name: "Checkout"
        uses: actions/checkout@v7
      
      - name: "Azure login"
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: "Azure show account"
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript:
            az account show

      - name: "Azure storage account list"
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript:
            az storage account list

      - name: "Get Azure container content"
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            az storage container show \
              --name ${{ vars.TF_STATE_CONTAINER_NAME}} \
              --account-name ${{ vars.STORAGE_ACCOUNT_NAME}} \
              --auth-mode login