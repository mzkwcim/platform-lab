on:
  pull_request:
    branches:
      - master

permissions:
  contents: read
  id-token: write

jobs:
  azure_oidc_test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/cloudflare
    steps:
      - name: "Checkout"
        uses: actions/checkout@v7
      
      - name: "Azure login"
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: "Azure show account - Auth proof"
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript:
            az account show

      - name: "Azure storage account list - not authorized proof"
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript:
            az storage account list