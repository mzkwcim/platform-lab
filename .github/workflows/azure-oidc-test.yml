on:
  pull_request:
    branches:
      - master

permissions:
  contents: read
  id-token: write

env:
  ARM_USE_OIDC: ${{ vars.ARM_USE_OIDC }}
  ARM_USE_AZUREAD: ${{ vars.ARM_USE_AZUREAD }}
  ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  TF_VAR_domain_name: ${{ vars.DOMAIN_NAME }}
  TF_VAR_account_id: ${{ vars.ACCOUNT_ID }}
  TF_VAR_d1_binding_name: ${{ vars.D1_BINDING_NAME }}
  TF_VAR_worker_name: ${{ vars.WORKER_NAME }}
  TF_VAR_worker_code_path: ${{ vars.WORKER_CODE_PATH }}
  TF_VAR_database_name: ${{ vars.DATABASE_NAME }}
  TF_VAR_dns_records: ${{ vars.DNS_RECORDS }}
  storage_account_name: ${{ vars.STORAGE_ACCOUNT_NAME }}
  TF_STATE_CONTAINER_NAME: ${{ vars.TF_STATE_CONTAINER_NAME }}
  KEY: ${{ vars.KEY }}

jobs:
  azure_oidc_test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/cloudflare
    steps:
      - name: "Checkout"
        uses: actions/checkout@v7

      - name: "Set up terraform"
        uses: hashicorp/setup-terraform@v4
      
      - name: "Azure login"
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.ARM_CLIENT_ID }}
          tenant-id: ${{ secrets.ARM_TENANT_ID }}
          subscription-id: ${{ secrets.ARM_SUBSCRIPTION_ID }}

      - name: "Azure show account"
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript:
            az account show

      - name: "Azure storage account list"
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript:
            az storage account list

      - name: "Get Azure container content"
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            az storage container show \
              --name ${{ vars.TF_STATE_CONTAINER_NAME }} \
              --account-name ${{ vars.STORAGE_ACCOUNT_NAME }} \
              --auth-mode login

      - name: "Init terraform"
        run: |
          terraform init \
          -backend-config "storage_account_name=${{ vars.storage_account_name }}" \
          -backend-config "container_name=${{ vars.TF_STATE_CONTAINER_NAME }}" \
          -backend-config "key=${{ vars.KEY }}"

      - name: "terraform plan"
        run: terraform plan 

      
