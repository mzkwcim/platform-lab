on:
  pull_request:
    branches:
      - master

permissions:
  contents: read
  id-token: write

env:
  ARM_USE_OIDC: ${{ vars.ARM_USE_OIDC }}
  ARM_USE_AZUREAD: ${{ vars.ARM_USE_AZUREAD }}
  ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  TF_VAR_domain_name: ${{ vars.DOMAIN_NAME }}
  TF_VAR_account_id: ${{ vars.ACCOUNT_ID }}
  TF_VAR_d1_binding_name: ${{ vars.D1_BINDING_NAME }}
  TF_VAR_worker_name: ${{ vars.WORKER_NAME }}
  TF_VAR_worker_code_path: ${{ vars.WORKER_CODE_PATH }}
  TF_VAR_database_name: ${{ vars.DATABASE_NAME }}
  TF_VAR_dns_records: ${{ vars.DNS_RECORDS }}
  storage_account_name: ${{ vars.STORAGE_ACCOUNT_NAME }}
  TF_STATE_CONTAINER_NAME: ${{ vars.TF_STATE_CONTAINER_NAME }}
  KEY: ${{ vars.KEY }}

jobs:
  terraform_plan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/cloudflare
    steps:
      - name: "Checkout"
        uses: actions/checkout@v7

      - name: "Set up terraform"
        uses: hashicorp/setup-terraform@v4
      
      - name: "Azure login"
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.ARM_CLIENT_ID }}
          tenant-id: ${{ secrets.ARM_TENANT_ID }}
          subscription-id: ${{ secrets.ARM_SUBSCRIPTION_ID }}

      - name: "Azure show account"
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript:
            az account show

      - name: "Azure storage account list"
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript:
            az storage account list

      - name: "Get Azure container content"
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            az storage container show \
              --name ${{ vars.TF_STATE_CONTAINER_NAME }} \
              --account-name ${{ vars.STORAGE_ACCOUNT_NAME }} \
              --auth-mode login

      - name: "Init terraform"
        run: |
          terraform init \
          -backend-config "storage_account_name=${{ vars.storage_account_name }}" \
          -backend-config "container_name=${{ vars.TF_STATE_CONTAINER_NAME }}" \
          -backend-config "key=${{ vars.KEY }}"

      - name: "terraform plan"
        id: plan
        run: |
          set +e
          terraform plan -out=tfplan -detailed-exitcode
          PLAN_EXIT_CODE=$?
          set -e

          if [ "$PLAN_EXIT_CODE" -eq 1 ]; then
            echo "Terraform plan failed"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          if [ "$PLAN_EXIT_CODE" -eq 2 ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          elif [ "$PLAN_EXIT_CODE" -gt 2 ]; then
            echo "has_changes=unexpected error" >> "$GITHUB_OUTPUT"
          else 
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi
          echo "exitcode=$PLAN_EXIT_CODE" >> "$GITHUB_OUTPUT"


      - name: "terraform show"
        run: |
          terraform show -no-color tfplan > plan.txt
          terraform show -json tfplan > plan.json

      - name: "Count changes"
        id: count_changes
        run: |
          echo "create_count=$(jq '[.resource_changes[]
            | select(.change.actions == ["create"])
            ] | length' plan.json)" >> "$GITHUB_OUTPUT"

          echo "update_count=$(jq '[.resource_changes[]
            | select(.change.actions == ["update"])
            ] | length' plan.json)" >> "$GITHUB_OUTPUT"

          echo "delete_count=$(jq '[.resource_changes[]
            | select(.change.actions == ["delete"])
            ] | length' plan.json)" >> "$GITHUB_OUTPUT"

          echo "replace_count=$(jq '[.resource_changes[]
            | select(
                .change.actions == ["delete","create"]
                or
                .change.actions == ["create","delete"]
              )
            ] | length' plan.json)" >> "$GITHUB_OUTPUT"

      - name: "Build comment"
        id: build_comment
        env:
          PLAN_EXIT_CODE: ${{ steps.plan.outputs.exitcode }}
          HAS_CHANGES: ${{ steps.plan.outputs.has_changes }}
          CREATE_COUNT: ${{ steps.count_changes.outputs.create_count }}
          UPDATE_COUNT: ${{ steps.count_changes.outputs.update_count }}
          DELETE_COUNT: ${{ steps.count_changes.outputs.delete_count }}
          REPLACE_COUNT: ${{ steps.count_changes.outputs.replace_count }}
        run: |
          if [ "$PLAN_EXIT_CODE" -eq 0 ]; then
            status="Success - no changes"
          elif [ "$PLAN_EXIT_CODE" -eq 1 ]; then
            status="Failed"
          elif [ "$PLAN_EXIT_CODE" -eq 2 ]; then
            status="Success - changes to review"
          else
            status="Failed with unexpected error"
          fi

          changes=""

          if [ "$HAS_CHANGES" = "true" ]; then
            changes="$(cat plan.txt)"
          fi

          cat <<EOF > comment.md
          ## Terraform Plan

          Status: $status

          Creates: $CREATE_COUNT
          Updates: $UPDATE_COUNT
          Deletes: $DELETE_COUNT
          Replacements: $REPLACE_COUNT

          <details>
          <summary>Show full plan</summary>

          \`\`\`text
          $changes
          \`\`\`

          </details>
          EOF

          cat comment.md